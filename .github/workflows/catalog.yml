name: Weekly catalog update
on:
  schedule:
    - cron: "17 9 * * 3"   # Wednesdays, after new-comic day
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Scan new IDs, enrich, name, build
        env: { RATE: "5", THREADS: "6" }
        run: python3 scripts/catalog.py update
      - name: Commit
        run: |
          git config user.name "catalog-bot"
          git config user.email "catalog-bot@users.noreply.github.com"
          git add data/raw public/data
          git diff --cached --quiet || git commit -m "Catalog update $(date -u +%F)"
          git push
